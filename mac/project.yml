name: MagicKeys
options:
  bundleIdPrefix: io.usemagic
  deploymentTarget:
    macOS: "15.0"
packages:
  MagicKeysCore:
    path: MagicKeysCore
targets:
  MagicKeys:
    type: application
    platform: macOS
    sources:
      - path: MagicKeys/Sources
      - path: MagicKeys/Resources
        buildPhase: resources
      - path: MagicKeys/MagicIcon.icon   # Icon Composer app icon (Xcode 26)
        type: file
    dependencies:
      - package: MagicKeysCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.usemagic.magickeys
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Magic Keys
        INFOPLIST_KEY_LSUIElement: YES   # menu-bar app, no Dock icon
        ASSETCATALOG_COMPILER_APPICON_NAME: MagicIcon
        CODE_SIGN_IDENTITY: "-"          # ad-hoc signing for dev builds
        SWIFT_VERSION: "5.9"
